methodology_summary: >
  This project ranks candidates using SentenceTransformer embeddings,
  cosine similarity, production score, behavior score, and professional
  score. Scores are normalized and combined into a weighted final score.
  The top 100 candidates are selected, and profile-based reasoning is
  generated using structured information extracted from candidate profiles.
