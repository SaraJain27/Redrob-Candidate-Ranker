methodology_summary: |
  This project ranks candidates by combining semantic similarity with
  AI-specific feature scoring. Candidate profiles are converted into text
  representations and encoded using the Sentence Transformers
  all-MiniLM-L6-v2 model. The system computes semantic similarity between
  the candidate profile and the target Job Description, then combines it
  with AI Skill Score, Role Relevance Score, and Production Experience
  Score using a weighted hybrid ranking algorithm. The system generates
  explainable reasoning for each ranked candidate and exports the results
  as a downloadable CSV. The application supports uploaded CSV and JSON
  candidate datasets (up to 100 candidates) for reproducible evaluation
  in the hackathon sandbox.

